            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 5px;
            text-align: center;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-align: center;
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        select, button {
            padding: 8px 14px;
            font-size: 0.95rem;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            background-color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
        }
        button:active {
            background-color: #2980b9;
        }
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 100%;
            overflow: auto;
        }
        .hint-banner {
            background-color: #fef9e7;
            border: 1px solid #f9e79f;
            color: #7d6608;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        table.nonogram-table {
            border-collapse: collapse;
            margin: 0 auto;
        }
        .nonogram-table td {
            border: 1px solid #bdc3c7;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            padding: 0;
            user-select: none;
        }
        /* 5x5 및 7x7 기본 셀 크기 */
        .nonogram-table.size-5 td {
            width: 34px;
            height: 34px;
            font-size: 0.85rem;
        }
        .nonogram-table.size-7 td {
            width: 28px;
            height: 28px;
            font-size: 0.78rem;
        }
        /* 21x21 전용 컴팩트 셀 크기 */
        .nonogram-table.size-21 td {
            width: 18px;
            height: 18px;
            font-size: 0.6rem;
        }
        .nonogram-table.size-21 .hint-cell {
            font-size: 0.62rem;
            line-height: 1.05;
            padding: 1px 2px;
        }
        .hint-cell {
            background-color: #eaeded;
            color: #34495e;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.15;
            font-size: 0.75rem;
        }
        .play-cell {
            background-color: #ffffff;
            cursor: pointer;
            transition: background-color 0.05s;
        }
        .play-cell:hover {
            background-color: #eaf2f8;
        }
        .play-cell.filled {
            background-color: #2c3e50 !important;
        }
        .play-cell.marked::after {
            content: '✕';
            color: #e74c3c;
            font-size: 1rem;
        }
        .nonogram-table.size-21 .play-cell.marked::after {
            font-size: 0.75rem;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
        }
        .mode-btn {
            padding: 6px 14px;
            font-size: 0.9rem;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
            background: #ecf0f1;
            color: #2c3e50;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }
        .tip-text {
            font-size: 0.8rem;
            color: #95a5a6;
        }
        .message {
            margin-top: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            min-height: 26px;

        function initGame() {
            const parts = document.getElementById('stageSelect').value.split('_');
            size = parseInt(parts[0]);
            const puzzleIdx = parseInt(parts[1]);

            const selectedPuzzle = puzzleDatabase[size][puzzleIdx];
            solution = selectedPuzzle.grid;
            currentTitle = selectedPuzzle.title;
            
            document.getElementById('hintText').innerText = `"${selectedPuzzle.hint}"`;
            document.getElementById('message').innerText = '';

            playerBoard = Array(size).fill(0).map(() => Array(size).fill(0));
            renderBoard();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeFill').classList.toggle('active', mode === 'fill');
            document.getElementById('modeMark').classList.toggle('active', mode === 'mark');
        }

        function getHints(line) {
            let hints = [];
            let count = 0;
            for (let val of line) {
                if (val === 1) {
                    count++;
                } else if (count > 0) {
                    hints.push(count);
                    count = 0;
                }
            }
            if (count > 0) hints.push(count);
            return hints.length > 0 ? hints.join(' ') : '0';
        }

        function renderBoard() {
            const container = document.getElementById('board-container');
            
            let rowHints = solution.map(row => getHints(row));
            let colHints = [];
            for (let c = 0; c < size; c++) {
                let col = [];
                for (let r = 0; r < size; r++) {
                    col.push(solution[r][c]);
                }
                colHints.push(getHints(col));
            }

            let html = `<table class="nonogram-table size-${size}">`;
            
            html += '<tr><td class="hint-cell"></td>';
            for (let c = 0; c < size; c++) {
                html += `<td class="hint-cell">${colHints[c].split(' ').join('<br>')}</td>`;
            }
            html += '</tr>';

            for (let r = 0; r < size; r++) {
                html += '<tr>';
                html += `<td class="hint-cell" style="padding: 0 4px;">${rowHints[r]}</td>`;
                
                for (let c = 0; c < size; c++) {
                    html += `<td class="play-cell" id="cell-${r}-${c}" 
                                onmousedown="startDrag(${r}, ${c}, event)" 
                                onmouseenter="dragOver(${r}, ${c})"></td>`;
                }
                html += '</tr>';
            }

            html += '</table>';
            container.innerHTML = html;
            container.oncontextmenu = (e) => e.preventDefault();
        }

        function startDrag(r, c, event) {
            if (event.button !== 0 && event.button !== 2) return;
            event.preventDefault();

            isDragging = true;
            let activeMode = currentMode;
            if (event.button === 2) {
                activeMode = (currentMode === 'fill') ? 'mark' : 'fill';
            }

            let curVal = playerBoard[r][c];
            if (activeMode === 'fill') {
                dragTargetVal = (curVal === 1) ? 0 : 1;
            } else {
                dragTargetVal = (curVal === -1) ? 0 : -1;
            }

            applyCell(r, c, dragTargetVal);
        }

        function dragOver(r, c) {
            if (!isDragging) return;
            applyCell(r, c, dragTargetVal);
        }

        function applyCell(r, c, val) {
            playerBoard[r][c] = val;
            const cell = document.getElementById(`cell-${r}-${c}`);
            if (!cell) return;

            cell.className = 'play-cell';
            if (val === 1) cell.classList.add('filled');
            if (val === -1) cell.classList.add('marked');
        }

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        function checkAnswer() {
            const msg = document.getElementById('message');
            let isCorrect = true;

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let expected = solution[r][c];
                    let actual = playerBoard[r][c] === 1 ? 1 : 0;
                    if (expected !== actual) {
                        isCorrect = false;
                    }
                }
            }

            if (isCorrect) {
                msg.style.color = '#27ae60';
                msg.innerText = `🎉 정답입니다! 완성된 그림은 [${currentTitle}]입니다!`;
            } else {
                msg.style.color = '#c0392b';
                msg.innerText = '❌ 아직 완성되지 않았거나 틀린 부분이 있습니다. 다시 확인해 보세요!';
            }
        }

        window.onload = initGame;
