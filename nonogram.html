<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 네모네모 로직 (마스터 에디션)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f9fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 5px;
            text-align: center;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-align: center;
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        select, button {
            padding: 8px 14px;
            font-size: 0.95rem;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            background-color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
        }
        button:active {
            background-color: #2980b9;
        }
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 100%;
            overflow: auto;
            position: relative;
        }
        .hint-banner {
            background-color: #fef9e7;
            border: 1px solid #f9e79f;
            color: #7d6608;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 90vw;
            box-sizing: border-box;
            line-height: 1.4;
        }
        #board-container {
            touch-action: none;
            overflow: auto;
            max-width: 100%;
        }
        table.nonogram-table {
            border-collapse: collapse;
            margin: 0 auto;
            touch-action: none;
        }
        .nonogram-table td {
            border: 1px solid #bdc3c7;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .nonogram-table.size-5 td {
            width: 36px;
            height: 36px;
            font-size: 0.85rem;
        }
        .nonogram-table.size-7 td {
            width: 30px;
            height: 30px;
            font-size: 0.78rem;
        }
        .nonogram-table.size-21 td {
            width: 17px;
            height: 17px;
            font-size: 0.58rem;
        }
        .nonogram-table.size-21 .hint-cell {
            font-size: 0.6rem;
            line-height: 1.05;
            padding: 1px;
        }
        .hint-cell {
            background-color: #eaeded;
            color: #34495e;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.15;
            font-size: 0.75rem;
            transition: background-color 0.2s, color 0.2s;
        }

        @keyframes blinkHint {
            0%, 100% {
                background-color: #eaeded;
                color: #34495e;
            }
            50% {
                background-color: #fadbd8;
                color: #c0392b;
                box-shadow: inset 0 0 0 2px #e74c3c;
            }
        }

        .hint-cell.blink-error {
            animation: blinkHint 0.8s ease-in-out infinite;
            position: relative;
            z-index: 5;
        }

        .play-cell {
            background-color: #ffffff;
            cursor: pointer;
            transition: background-color 0.05s;
        }
        .play-cell:hover {
            background-color: #eaf2f8;
        }
        .play-cell.filled {
            background-color: #2c3e50 !important;
        }
        .play-cell.marked::after {
            content: '✕';
            color: #e74c3c;
            font-size: 1rem;
        }
        .nonogram-table.size-21 .play-cell.marked::after {
            font-size: 0.75rem;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
        }
        .mode-btn {
            padding: 6px 14px;
            font-size: 0.9rem;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
            background: #ecf0f1;
            color: #2c3e50;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }
        .tip-text {
            font-size: 0.8rem;
            color: #95a5a6;
            text-align: center;
        }
        .message {
            margin-top: 10px;
            font-size: 1rem;
            line-height: 1.5;
            font-weight: bold;
            text-align: center;
            min-height: 26px;
        }

        #drag-counter {
            position: fixed;
            display: none;
            pointer-events: none;
            background-color: #e74c3c;
            color: #ffffff;
            font-weight: 900;
            font-size: 0.88rem;
            padding: 3px 8px;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            z-index: 10000;
            transform: translate(16px, -26px);
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="drag-counter">2</div>

    <h1>🧩 네모네모 로직 (노노그램)</h1>
    <p class="subtitle">심오한 수수께끼를 풀며 숨겨진 그림을 완성해 보세요!</p>

    <div class="controls">

            <optgroup label="👑 21 x 21 퍼즐 (마스터 15제)">
                <option value="21_0" selected>21x21 - 퍼즐 01</option>
                <option value="21_1">21x21 - 퍼즐 02</option>
                <option value="21_2">21x21 - 퍼즐 03</option>
                <option value="21_3">21x21 - 퍼즐 04</option>
                <option value="21_4">21x21 - 퍼즐 05</option>
                <option value="21_5">21x21 - 퍼즐 06 (신규)</option>
                <option value="21_6">21x21 - 퍼즐 07 (신규)</option>

                <option value="21_13">21x21 - 퍼즐 14 (신규)</option>
                <option value="21_14">21x21 - 퍼즐 15 (신규)</option>
            </optgroup>
            <optgroup label="🌿 7 x 7 퍼즐 (도전 20제)">
                <option value="7_0">7x7 - 퍼즐 01</option>
                <option value="7_1">7x7 - 퍼즐 02</option>
                <option value="7_2">7x7 - 퍼즐 03</option>
                <option value="7_3">7x7 - 퍼즐 04</option>
                <option value="7_4">7x7 - 퍼즐 05</option>
                <option value="7_5">7x7 - 퍼즐 06</option>
                <option value="7_6">7x7 - 퍼즐 07</option>
                <option value="7_7">7x7 - 퍼즐 08</option>
                <option value="7_8">7x7 - 퍼즐 09</option>
                <option value="7_9">7x7 - 퍼즐 10</option>
                <option value="7_10">7x7 - 퍼즐 11 (신규)</option>
                <option value="7_11">7x7 - 퍼즐 12 (신규)</option>
                <option value="7_12">7x7 - 퍼즐 13 (신규)</option>
                <option value="7_13">7x7 - 퍼즐 14 (신규)</option>
                <option value="7_14">7x7 - 퍼즐 15 (신규)</option>
                <option value="7_15">7x7 - 퍼즐 16 (신규)</option>
                <option value="7_16">7x7 - 퍼즐 17 (신규)</option>

            </optgroup>
            <optgroup label="🌱 5 x 5 퍼즐 (입문 20제)">
                <option value="5_0">5x5 - 퍼즐 01</option>

                <option value="5_5">5x5 - 퍼즐 06</option>
                <option value="5_6">5x5 - 퍼즐 07</option>
                <option value="5_7">5x5 - 퍼즐 08</option>
                <option value="5_8">5x5 - 퍼즐 09</option>

        </select>
        <button onclick="initGame()">다시 시작</button>
        <button onclick="checkAnswer()" style="background-color: #2ecc71;">정답 확인</button>
    </div>

    <div class="game-layout">
        <div class="hint-banner" id="hintBanner">
            <span>💡 힌트:</span> <span id="hintText">로딩 중...</span>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" id="modeFill" onclick="setMode('fill')">✏️ 채우기 (■)</button>
            <button class="mode-btn" id="modeMark" onclick="setMode('mark')">❌ X표시 (X)</button>
        </div>
        <div class="tip-text">마우스/손가락 드래그 시 2칸 이상부터 개수 카운터 표시</div>
        <div id="board-container"></div>
    </div>

    <div class="message" id="message"></div>

    <script>
        let size = 21;
        let solution = [];
        let playerBoard = [];
        let currentMode = 'fill';
        let currentTitle = '';
        
        let isDragging = false;
        let startR = -1;
        let startC = -1;
        let dragTargetVal = 0;
        let boardSnapshot = [];
        let activeLineCells = [];
        let touchEventsInitialized = false;

        function parseGrid(arr) {
            return arr.map(row => row.split('').map(Number));
        }

        const puzzleDatabase = {
            5: [
                { title: "돛단배", hint: "바람의 숨결을 빌려 푸른 심연의 등뼈를 타넘는 삼각의 방랑자", grid: parseGrid(["01000","01100","01111","11110","00100"]) },
                { title: "오리", hint: "물밑에선 쉼 없이 발버둥 치며 수면 위에선 태연히 미끄러지는 깃털", grid: parseGrid(["01100","11100","00111","01111","00110"]) },
                { title: "열쇠", hint: "맞물린 톱니의 비밀을 풀어 굳게 닫힌 경계를 허무는 쇠붙이", grid: parseGrid(["01100","11110","00100","00110","00111"]) },
                { title: "계단", hint: "중력을 거슬러 하늘로 딛거나, 대지의 품으로 침묵하며 꺾여 내려가는 발판", grid: parseGrid(["11000","11110","01111","00111","00011"]) },
                { title: "머그컵", hint: "속을 비워 뜨거운 온기를 품고, 둥근 귀 하나로 사람의 손길을 붙잡는 그릇", grid: parseGrid(["11110","10011","10011","11110","01100"]) },
                { title: "우산", hint: "하늘이 눈물 흘릴 때만 뼈대를 펼쳐 지상의 머리를 감싸는 방패", grid: parseGrid(["01110","11111","00100","00100","01100"]) },
                { title: "음표", hint: "오선이라는 보이지 않는 줄 위에 매달려 침묵에 소리를 입히는 검은 씨앗", grid: parseGrid(["00111","00101","00101","11101","11011"]) },
                { title: "의자", hint: "네 개의 발을 딛고 서서 오직 남의 무게만을 온전히 짊어지는 침묵의 자리", grid: parseGrid(["11000","11000","11111","11011","10001"]) },
                { title: "새싹", hint: "어둠의 껍질을 찢고 솟아올라 태양의 빛줄기를 두 팔 벌려 맞이하는 첫 숨", grid: parseGrid(["01100","11101","00111","00100","01110"]) },
                { title: "비행기", hint: "거대한 쇠의 날개로 대기의 흐름을 가르고 국경의 선을 지워버리는 은빛 새", grid: parseGrid(["00100","01110","11111","00100","01111"]) },
                { title: "모래시계", hint: "두 개의 방을 오가며 한 알의 먼지로 영원을 갉아먹는 시간의 감옥", grid: parseGrid(["11111","01110","00100","01110","11111"]) },
                { title: "버섯", hint: "그늘진 축축함 속에서 피어나 지혜의 모자를 쓰고 홀로 선 균사", grid: parseGrid(["01110","11111","00100","00100","01110"]) },
                { title: "닻", hint: "거친 파도 속으로 제 몸을 던져 거인의 발목을 바닥에 묶어두는 쇠갈고리", grid: parseGrid(["00100","10101","01110","00100","11111"]) },
                { title: "나비", hint: "추한 허물을 벗어던지고 공중의 꽃잎이 되어 춤추는 봄의 환영", grid: parseGrid(["11011","11111","00100","11111","11011"]) },
                { title: "가위", hint: "하나의 심장을 나누어 가진 두 날이 마주칠 때마다 세상의 인연을 가르는 도구", grid: parseGrid(["11011","11011","00100","01010","10001"]) },
                { title: "전구", hint: "가느다란 심장에 번개를 가두어 밤을 낮으로 바꾸는 유리 알", grid: parseGrid(["01110","11111","11111","01110","00100"]) },
                { title: "활", hint: "제 등을 활처럼 휘어 침묵의 화살에 분노의 속도를 실어 보내는 무기", grid: parseGrid(["01100","10010","10001","10010","01100"]) },
                { title: "나무", hint: "대지의 깊은 곳을 움켜쥐고 하늘을 향해 무수한 푸른 손을 뻗는 거인", grid: parseGrid(["00100","01110","11111","00100","00100"]) },
                { title: "하트", hint: "붉은 고동으로 생명을 펌프질하며 모든 시와 노래의 근원이 되는 기관", grid: parseGrid(["01010","11111","11111","01110","00100"]) },
                { title: "달", hint: "스스로 빛나지 못하면서도 어둠 속에서 태양의 얼굴을 은빛으로 훔쳐 비추는 거울", grid: parseGrid(["00110","01100","11000","01100","00110"]) }
            ],
            7: [
                { title: "요트", hint: "엔진의 굉음 없이 하얀 돛폭만으로 바다의 분노를 유희하는 날렵한 칼날", grid: parseGrid(["0010000","0011000","0111100","0010000","1111110","0111100","1101101"]) },
                { title: "커피잔", hint: "검은 액체 위로 피어오르는 아지랑이에 하루의 피로를 녹여내는 작은 연못", grid: parseGrid(["0101000","0010100","1111110","1111101","1111101","0111011","0111110"]) },
                { title: "사과", hint: "낙원의 금기를 깨뜨리고 중력의 법칙을 일깨워준 유혹의 붉은 구체", grid: parseGrid(["0001100","0010100","0111110","1111111","1111111","1111110","0110110"]) },
                { title: "보물 열쇠", hint: "오랜 세월 봉인된 탐욕과 황금의 빗장을 푸는 낡은 금속 조각", grid: parseGrid(["0111000","1101100","1101100","0111000","0010000","0011100","0011111"]) },
                { title: "달팽이", hint: "제 집을 등 뒤에 짊어진 채 은빛 궤적을 그리며 세상에서 가장 느리게 걷는 은둔자", grid: parseGrid(["0011100","0110110","0101110","0111100","0011010","1111111","0111110"]) },
                { title: "헬리콥터", hint: "날개를 제 머리 위에서 돌려 수직으로 허공을 뚫고 솟구치는 잠자리", grid: parseGrid(["1111110","0010000","0111111","1101101","0111100","0010100","0111100"]) },
                { title: "고양이", hint: "소리 없이 다가와 경계의 눈빛을 거두지 않는 밤의 지배자", grid: parseGrid(["1100011","1110111","1111111","1011111","1110111","0111110","0011100"]) },
                { title: "선인장", hint: "타는 갈증을 제 몸 안에 가두고 무수한 가시로 사막의 침략자를 밀어내는 파수꾼", grid: parseGrid(["0001100","1101100","1101111","0111101","0001100","0111110","0011100"]) },
                { title: "피아노", hint: "흑과 백, 여든여덟 개의 계단을 오르내리며 영혼을 흔드는 울림의 거목", grid: parseGrid(["1111111","1111110","1010110","1111110","1000010","1000010","1101011"]) },
                { title: "왕관", hint: "피와 권세로 벼려내어 오직 한 사람의 이마만을 허락하는 황금 족쇄", grid: parseGrid(["1001000","1101011","1111111","0111110","0101010","1111111","1111111"]) },
                { title: "해마", hint: "말의 머리와 용의 비늘을 품고 바닷말 숲에 꼬리를 감아 숨죽인 기사", grid: parseGrid(["0011000","0111100","0011000","0011100","0001100","0011000","0110000"]) },
                { title: "다이아몬드", hint: "수억 년 지하의 고열과 압력을 견뎌내고 태어난 지상에서 가장 단단한 빛", grid: parseGrid(["0001000","0011100","0111110","1111111","0111110","0011100","0001000"]) },
                { title: "등대", hint: "폭풍우 치는 암흑의 수평선에 외눈박이 빛줄기를 쏘아 길 잃은 배를 부르는 기둥", grid: parseGrid(["0001000","0011100","0011100","0111110","0111110","1111111","1111111"]) },
                { title: "전갈", hint: "모래 속에 숨어 독이 오른 꼬리를 치켜들고 죽음의 입맞춤을 기다리는 사막의 자객", grid: parseGrid(["0000110","0000011","0111001","1111101","0111110","1000001","0110110"]) },
                { title: "나침반", hint: "흔들리는 세상 한가운데서도 오직 보이지 않는 북극만을 가리키며 떠는 바늘", grid: parseGrid(["0001000","0011100","0111110","1110111","0111110","0011100","0001000"]) },
                { title: "하프", hint: "천사의 날개를 닮은 활에 줄을 걸어 천상의 선율을 튕겨내는 울림통", grid: parseGrid(["1111110","1000010","1000110","1001100","1011000","1110000","1111111"]) },
                { title: "풍차", hint: "사계절 불어오는 대기의 한숨을 받아 돌을 갈고 가루를 빻는 거대한 바람개비", grid: parseGrid(["1100011","0110110","0011100","1111111","0011100","0110110","1100011"]) },

                    "000000000010000000000","000000000010000000000","000000000111000000000","000000000111000000000","000000011111110000000",

                    "000000000000001100000","000000000000111110000","000000000011111110000","000000001111111000000","000000111111000000000",
                    "000011111100000000000","000111110000000000000","001111100000111111000","011111000011111111100","111110001111111111110",

                ]) },
                { title: "기마 기사", hint: "강철 갑옷을 두르고 창을 겨눈 채 전장의 포화를 뚫고 돌진하는 철혈의 전사", grid: parseGrid([
                    "000000000010000000000","000000000111000000000","000000001111100000000","000000000111000000000","000000011111110000000",
                    "000000111111111000000","000001111111111100000","000011111111111110000","000111111111111111000","001111111111111111100",
                    "011111111111111111110","111111111111111111111","111111111111111111111","011111111111111111110","001111111111111111100",
                    "000111110000011111000","000111100000001111000","000111000000000111000","000110000000000011000","001110000000000011100",

                ]) },
                { title: "스핑크스", hint: "모래바람 속에 웅크린 채 오가는 여행자에게 죽음의 질문을 던지던 반인반수의 파수병", grid: parseGrid([
                    "000000000111100000000","000000001111110000000","000000011011011000000","000000011111111000000","000000001111110000000",
                    "000000000111100000000","000000011111111000000","000000111111111100000","000001111111111110000","000011111111111111000",

                ]) },
                { title: "풍차 방앗간", hint: "끝없는 평원 언덕 위에서 사계절 쉬지 않고 허공을 낚아채어 곡식을 빻는 네 잎의 거인", grid: parseGrid([
                    "000000000010000000000","110000000111000000011","111100000111000001111","011111000111000111110","001111100111001111100",
                    "000111110111011111000","000011111111111110000","000001111111111100000","000000111111111000000","111111111111111111111",
                    "000000000111000000000","000000000111000000000","000000001111100000000","000000001111100000000","000000011111110000000",

                ]) },
                { title: "자유의 여신상", hint: "신대륙의 관문에서 횃불을 높이 들고 지친 방랑자들에게 쉼터를 약속하는 거대한 녹색 여인", grid: parseGrid([
                    "000000000000000001100","000000000000000011110","000000000000000001100","000000000100000001000","000000001110000011000",
                    "000000011111000011000","000000001110000110000","000000011111000110000","000000111111101100000","000001111111111100000",

        };

        function clearBlinkErrors() {
            document.querySelectorAll('.hint-cell').forEach(cell => {
                cell.classList.remove('blink-error');
            });
        }

        function initGame() {
            const parts = document.getElementById('stageSelect').value.split('_');
            size = parseInt(parts[0]);
            const puzzleIdx = parseInt(parts[1]);

            const selectedPuzzle = puzzleDatabase[size][puzzleIdx];
            solution = selectedPuzzle.grid;
            currentTitle = selectedPuzzle.title;
            
            document.getElementById('hintText').innerText = `"${selectedPuzzle.hint}"`;
            document.getElementById('message').innerText = '';

            // 드래그 및 UI 상태 완전 초기화
            isDragging = false;
            startR = -1;
            startC = -1;
            activeLineCells = [];
            boardSnapshot = [];
            const counter = document.getElementById('drag-counter');
            if (counter) counter.style.display = 'none';

            clearBlinkErrors();
            playerBoard = Array(size).fill(0).map(() => Array(size).fill(0));
            renderBoard();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeFill').classList.toggle('active', mode === 'fill');
            document.getElementById('modeMark').classList.toggle('active', mode === 'mark');
        }

        function getHints(line) {
            let hints = [];
            let count = 0;
            for (let val of line) {
                if (val === 1) {
                    count++;
                } else if (count > 0) {
                    hints.push(count);
                    count = 0;
                }
            }
            if (count > 0) hints.push(count);
            return hints.length > 0 ? hints.join(' ') : '0';
        }

        function renderBoard() {
            const container = document.getElementById('board-container');
            
            let rowHints = solution.map(row => getHints(row));
            let colHints = [];
            for (let c = 0; c < size; c++) {
                let col = [];
                for (let r = 0; r < size; r++) {
                    col.push(solution[r][c]);
                }
                colHints.push(getHints(col));
            }

            let html = `<table class="nonogram-table size-${size}">`;
            
            html += '<tr><td class="hint-cell"></td>';
            for (let c = 0; c < size; c++) {
                html += `<td class="hint-cell" id="col-hint-${c}">${colHints[c].split(' ').join('<br>')}</td>`;
            }
            html += '</tr>';

            for (let r = 0; r < size; r++) {
                html += '<tr>';
                html += `<td class="hint-cell" id="row-hint-${r}" style="padding: 0 4px;">${rowHints[r]}</td>`;
                
                for (let c = 0; c < size; c++) {
                    html += `<td class="play-cell" id="cell-${r}-${c}" 
                                onmousedown="handleMouseDown(${r}, ${c}, event)"></td>`;
                }
                html += '</tr>';
            }

            html += '</table>';
            container.innerHTML = html;
            container.oncontextmenu = (e) => e.preventDefault();
        }

        function handleMouseDown(r, c, event) {
            if (event.button !== 0 && event.button !== 2) return;
            event.preventDefault();

            let isRightClick = (event.button === 2);
            startDrag(r, c, event.clientX, event.clientY, isRightClick);
        }

        function startDrag(r, c, clientX, clientY, isSecondaryAction) {
            clearBlinkErrors();
            isDragging = true;
            startR = r;
            startC = c;
            activeLineCells = [];
            boardSnapshot = playerBoard.map(row => [...row]);

            let activeMode = currentMode;
            if (isSecondaryAction) {
                activeMode = (currentMode === 'fill') ? 'mark' : 'fill';
            }

            let curVal = playerBoard[r][c];
            if (activeMode === 'fill') {
                dragTargetVal = (curVal === 1) ? 0 : 1;
            } else {
                dragTargetVal = (curVal === -1) ? 0 : -1;
            }

            const counter = document.getElementById('drag-counter');
            if (counter) counter.style.display = 'none';

            updateLine(r, c, clientX, clientY);
        }

        function updateLine(curR, curC, clientX, clientY) {
            const dr = Math.abs(curR - startR);
            const dc = Math.abs(curC - startC);

            let lineCells = [];
            if (dc >= dr) {
                const minC = Math.min(startC, curC);
                const maxC = Math.max(startC, curC);
                for (let c = minC; c <= maxC; c++) {
                    lineCells.push({r: startR, c: c});
                }
            } else {
                const minR = Math.min(startR, curR);
                const maxR = Math.max(startR, curR);
                for (let r = minR; r <= maxR; r++) {
                    lineCells.push({r: r, c: startC});
                }
            }

            for (let cell of activeLineCells) {
                const origVal = boardSnapshot[cell.r][cell.c];
                playerBoard[cell.r][cell.c] = origVal;
                updateCellDOM(cell.r, cell.c, origVal);
            }

            for (let cell of lineCells) {
                playerBoard[cell.r][cell.c] = dragTargetVal;
                updateCellDOM(cell.r, cell.c, dragTargetVal);
            }

            activeLineCells = lineCells;

            const counter = document.getElementById('drag-counter');
            if (counter) {
                if (lineCells.length >= 2) {
                    counter.innerText = lineCells.length;
                    counter.style.display = 'block';
                    if (clientX !== undefined && clientY !== undefined) {
                        counter.style.left = `${clientX}px`;
                        counter.style.top = `${clientY}px`;
                    }
                } else {
                    counter.style.display = 'none';
                }
            }
        }

        function updateCellDOM(r, c, val) {
            const el = document.getElementById(`cell-${r}-${c}`);
            if (!el) return;
            el.className = 'play-cell';
            if (val === 1) el.classList.add('filled');
            if (val === -1) el.classList.add('marked');
        }

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const counter = document.getElementById('drag-counter');
            if (counter && counter.style.display === 'block') {
                counter.style.left = `${e.clientX}px`;
                counter.style.top = `${e.clientY}px`;
            }

            const target = document.elementFromPoint(e.clientX, e.clientY);
            if (target && target.classList.contains('play-cell')) {
                const parts = target.id.split('-');
                updateLine(parseInt(parts[1]), parseInt(parts[2]), e.clientX, e.clientY);
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                const counter = document.getElementById('drag-counter');
                if (counter) counter.style.display = 'none';
            }
        });

        // 모바일 터치 이벤트 1회 안전 초기화
        function initTouchEventsOnce() {
            if (touchEventsInitialized) return;
            touchEventsInitialized = true;

            const container = document.getElementById('board-container');

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) return;
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.classList.contains('play-cell')) {
                    e.preventDefault();
                    const parts = target.id.split('-');
                    startDrag(parseInt(parts[1]), parseInt(parts[2]), touch.clientX, touch.clientY, false);
                }
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length > 1) return;
                e.preventDefault();
                const touch = e.touches[0];
                
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.classList.contains('play-cell')) {
                    const parts = target.id.split('-');
                    updateLine(parseInt(parts[1]), parseInt(parts[2]), touch.clientX, touch.clientY);
                } else {
                    const counter = document.getElementById('drag-counter');
                    if (counter && counter.style.display === 'block') {
                        counter.style.left = `${touch.clientX}px`;
                        counter.style.top = `${touch.clientY}px`;
                    }
                }
            }, { passive: false });

            // 손가락을 어디서 떼든 확실히 드래그가 종료되도록 window에 바인딩
            const endTouch = () => {
                if (isDragging) {
                    isDragging = false;
                    const counter = document.getElementById('drag-counter');
                    if (counter) counter.style.display = 'none';
                }
            };

            window.addEventListener('touchend', endTouch);
            window.addEventListener('touchcancel', endTouch);
        }

        function checkAnswer() {
            const msg = document.getElementById('message');
            clearBlinkErrors();

            let wrongRows = [];
            let wrongCols = [];

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let actual = (playerBoard[r][c] === 1) ? 1 : 0;
                    if (actual !== solution[r][c]) {
                        wrongRows.push(r);
                        break;
                    }
                }
            }

            for (let c = 0; c < size; c++) {
                for (let r = 0; r < size; r++) {
                    let actual = (playerBoard[r][c] === 1) ? 1 : 0;
                    if (actual !== solution[r][c]) {
                        wrongCols.push(c);
                        break;
                    }
                }
            }

            if (wrongRows.length === 0 && wrongCols.length === 0) {
                msg.style.color = '#27ae60';
                msg.innerHTML = `🎉 정답입니다! 수수께끼의 정체는 [<b>${currentTitle}</b>]였습니다!`;
            } else {
                wrongRows.forEach(r => {
                    const el = document.getElementById(`row-hint-${r}`);
                    if (el) el.classList.add('blink-error');
                });
                wrongCols.forEach(c => {
                    const el = document.getElementById(`col-hint-${c}`);
                    if (el) el.classList.add('blink-error');
                });

                msg.style.color = '#c0392b';
                msg.innerText = '❌ 아직 완성되지 않았거나 틀린 부분이 있습니다. 깜빡이는 힌트를 확인해 보세요!';
            }
        }

        window.onload = () => {
            initGame();
            initTouchEventsOnce();
        };
    </script>
