            margin-bottom: 5px;

        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;

        select, button {
            padding: 8px 14px;

        button:active {

        }

            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 100%;
            overflow: auto;
            position: relative;
        }
        .hint-banner {
            background-color: #fef9e7;
            border: 1px solid #f9e79f;
            color: #7d6608;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        table.nonogram-table {
            border-collapse: collapse;
            margin: 0 auto;
        }
        .nonogram-table td {
            border: 1px solid #bdc3c7;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            padding: 0;
            user-select: none;
        }
        .nonogram-table.size-5 td {
            width: 34px;
            height: 34px;
            font-size: 0.85rem;
        }
        .nonogram-table.size-7 td {
            width: 28px;
            height: 28px;
            font-size: 0.78rem;
        }
        .nonogram-table.size-21 td {
            width: 18px;
            height: 18px;
            font-size: 0.6rem;
        }
        .nonogram-table.size-21 .hint-cell {
            font-size: 0.62rem;
            line-height: 1.05;
            padding: 1px 2px;
        }
        .hint-cell {
            background-color: #eaeded;
            color: #34495e;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.15;
            font-size: 0.75rem;
        }
        .play-cell {
            background-color: #ffffff;
            cursor: pointer;
            transition: background-color 0.05s;
        }
        .play-cell:hover {
            background-color: #eaf2f8;
        }
        .play-cell.filled {
            background-color: #2c3e50 !important;
        }
        .play-cell.marked::after {
            content: '✕';
            color: #e74c3c;
            font-size: 1rem;
        }
        .nonogram-table.size-21 .play-cell.marked::after {
            font-size: 0.75rem;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
        }
        .mode-btn {
            padding: 6px 14px;
            font-size: 0.9rem;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
            background: #ecf0f1;
            color: #2c3e50;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }
        .tip-text {
            font-size: 0.8rem;
            color: #95a5a6;
        }
        .message {
            margin-top: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            font-weight: bold;
            text-align: center;
            min-height: 26px;

            position: fixed;
            display: none;
            pointer-events: none;
            background-color: #e74c3c;
            color: #ffffff;
            font-weight: 900;
            font-size: 0.88rem;
            padding: 3px 8px;

            z-index: 10000;
            transform: translate(14px, -24px);
            white-space: nowrap;
            letter-spacing: 0.5px;

</head>

        function initGame() {
            const parts = document.getElementById('stageSelect').value.split('_');
            size = parseInt(parts[0]);
            const puzzleIdx = parseInt(parts[1]);

            const selectedPuzzle = puzzleDatabase[size][puzzleIdx];
            solution = selectedPuzzle.grid;
            currentTitle = selectedPuzzle.title;
            
            document.getElementById('hintText').innerText = `"${selectedPuzzle.hint}"`;
            document.getElementById('message').innerText = '';

            playerBoard = Array(size).fill(0).map(() => Array(size).fill(0));
            renderBoard();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeFill').classList.toggle('active', mode === 'fill');
            document.getElementById('modeMark').classList.toggle('active', mode === 'mark');
        }

        function getHints(line) {
            let hints = [];
            let count = 0;
            for (let val of line) {
                if (val === 1) {
                    count++;
                } else if (count > 0) {
                    hints.push(count);
                    count = 0;
                }
            }
            if (count > 0) hints.push(count);
            return hints.length > 0 ? hints.join(' ') : '0';
        }

        function renderBoard() {
            const container = document.getElementById('board-container');
            
            let rowHints = solution.map(row => getHints(row));
            let colHints = [];
            for (let c = 0; c < size; c++) {
                let col = [];
                for (let r = 0; r < size; r++) {
                    col.push(solution[r][c]);
                }
                colHints.push(getHints(col));
            }

            let html = `<table class="nonogram-table size-${size}">`;
            
            html += '<tr><td class="hint-cell"></td>';
            for (let c = 0; c < size; c++) {
                html += `<td class="hint-cell">${colHints[c].split(' ').join('<br>')}</td>`;
            }
            html += '</tr>';

            for (let r = 0; r < size; r++) {
                html += '<tr>';
                html += `<td class="hint-cell" style="padding: 0 4px;">${rowHints[r]}</td>`;
                
                for (let c = 0; c < size; c++) {
                    html += `<td class="play-cell" id="cell-${r}-${c}" 
                                onmousedown="startDrag(${r}, ${c}, event)" 
                                onmouseenter="dragOver(${r}, ${c})"></td>`;
                }
                html += '</tr>';
            }

            html += '</table>';
            container.innerHTML = html;
            container.oncontextmenu = (e) => e.preventDefault();
        }

        function startDrag(r, c, event) {
            if (event.button !== 0 && event.button !== 2) return;
            event.preventDefault();

            isDragging = true;
            startR = r;
            startC = c;
            activeLineCells = [];

            boardSnapshot = playerBoard.map(row => [...row]);

            let activeMode = currentMode;
            if (event.button === 2) {
                activeMode = (currentMode === 'fill') ? 'mark' : 'fill';
            }

            let curVal = playerBoard[r][c];
            if (activeMode === 'fill') {
                dragTargetVal = (curVal === 1) ? 0 : 1;
            } else {
                dragTargetVal = (curVal === -1) ? 0 : -1;
            }

            const counter = document.getElementById('drag-counter');
            counter.innerText = '1';
            counter.style.left = `${event.clientX}px`;
            counter.style.top = `${event.clientY}px`;
            counter.style.display = 'block';

            updateLine(r, c);
        }

        function dragOver(r, c) {
            if (!isDragging) return;
            updateLine(r, c);
        }

        function updateLine(curR, curC) {
            const dr = Math.abs(curR - startR);
            const dc = Math.abs(curC - startC);

            let lineCells = [];
            if (dc >= dr) {
                const minC = Math.min(startC, curC);
                const maxC = Math.max(startC, curC);
                for (let c = minC; c <= maxC; c++) {
                    lineCells.push({r: startR, c: c});
                }
            } else {
                const minR = Math.min(startR, curR);
                const maxR = Math.max(startR, curR);
                for (let r = minR; r <= maxR; r++) {
                    lineCells.push({r: r, c: startC});
                }
            }

            for (let cell of activeLineCells) {
                const origVal = boardSnapshot[cell.r][cell.c];
                playerBoard[cell.r][cell.c] = origVal;
                updateCellDOM(cell.r, cell.c, origVal);
            }

            for (let cell of lineCells) {
                playerBoard[cell.r][cell.c] = dragTargetVal;
                updateCellDOM(cell.r, cell.c, dragTargetVal);
            }

            activeLineCells = lineCells;

            const counter = document.getElementById('drag-counter');
            if (counter) {
                counter.innerText = lineCells.length;
            }
        }

        function updateCellDOM(r, c, val) {
            const el = document.getElementById(`cell-${r}-${c}`);
            if (!el) return;
            el.className = 'play-cell';
            if (val === 1) el.classList.add('filled');
            if (val === -1) el.classList.add('marked');
        }

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const counter = document.getElementById('drag-counter');
            counter.style.left = `${e.clientX}px`;
            counter.style.top = `${e.clientY}px`;
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                const counter = document.getElementById('drag-counter');
                if (counter) counter.style.display = 'none';
            }
        });

        function checkAnswer() {
            const msg = document.getElementById('message');

            let wrongRows = [];
            let wrongCols = [];

            // 1. 틀린 가로줄(행) 검출
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let actual = (playerBoard[r][c] === 1) ? 1 : 0;
                    if (actual !== solution[r][c]) {
                        wrongRows.push(r);
                        break;
                    }
                }
            }

            // 2. 틀린 세로줄(열) 검출
            for (let c = 0; c < size; c++) {
                for (let r = 0; r < size; r++) {
                    let actual = (playerBoard[r][c] === 1) ? 1 : 0;
                    if (actual !== solution[r][c]) {
                        wrongCols.push(c);
                        break;
                    }
                }
            }

            // 3. 결과 분기 (시각적 하이라이트 없이 텍스트 줄 번호만 안내)
            if (wrongRows.length === 0 && wrongCols.length === 0) {
                msg.style.color = '#27ae60';
                msg.innerHTML = `🎉 정답입니다! 완성된 그림은 [<b>${currentTitle}</b>]입니다!`;
            } else {
                msg.style.color = '#c0392b';
                let errorDetails = '❌ 아직 틀린 라인이 있습니다.<br>';
                if (wrongRows.length > 0) {
                    const rowList = wrongRows.map(r => r + 1).join(', ');
                    errorDetails += `• <b>가로(행)</b>: ${rowList}번째 줄<br>`;
                }
                if (wrongCols.length > 0) {
                    const colList = wrongCols.map(c => c + 1).join(', ');
                    errorDetails += `• <b>세로(열)</b>: ${colList}번째 줄`;
                }
                msg.innerHTML = errorDetails;
            }
        }

        window.onload = initGame;
