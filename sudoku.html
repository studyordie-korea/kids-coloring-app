<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 최적화 스도쿠</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        h2 {
            margin: 10px 0;
            color: #2c3e50;
        }

        /* 보드 레이아웃 */
        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: min(92vw, 400px);
            height: min(92vw, 400px);
            border: 2.5px solid #2c3e50;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* 각 셀 스타일 */
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0.5px solid #bdc3c7;
            font-size: 1.4rem;
            font-weight: bold;
            color: #2980b9;
            cursor: pointer;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        /* 3x3 구획 굵은 경계선 */
        .cell:nth-child(3n) { border-right: 2px solid #2c3e50; }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #2c3e50;
        }

        /* 셀 선택 상태 */
        .cell.selected {
            background-color: #d6eaf8 !important;
        }

        /* 초기 고정 숫자 */
        .cell.fixed {
            color: #2c3e50;
            background-color: #f2f4f4;
        }

        /* 핵심: 10 및 두 자리 숫자 폰트 축소 (0 가림 방지) */
        .cell.two-digits {
            font-size: 0.95rem !important;
            letter-spacing: -1.5px;
            padding-right: 1px;
        }

        /* 모바일용 자체 숫자 패드 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            width: min(92vw, 400px);
            margin-top: 20px;
        }

        .key-btn {
            height: 48px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            background-color: #ffffff;
            color: #2c3e50;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-btn:active {
            background-color: #ebf5fb;
        }

        .key-btn.action {
            background-color: #e74c3c;
            color: white;
            border: none;
            font-size: 1rem;
        }

        /* 숫자 패드의 10 버튼도 비율 조정 */
        .key-btn.num-10 {
            font-size: 1.05rem;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

    <h2>스도쿠</h2>

    <div class="sudoku-board" id="board"></div>

    <!-- 모바일 가상 키보드를 원천 차단하는 온스크린 숫자 패드 -->
    <div class="keypad">
        <button class="key-btn" onclick="inputNumber(1)">1</button>
        <button class="key-btn" onclick="inputNumber(2)">2</button>
        <button class="key-btn" onclick="inputNumber(3)">3</button>
        <button class="key-btn" onclick="inputNumber(4)">4</button>
        <button class="key-btn" onclick="inputNumber(5)">5</button>
        <button class="key-btn action" onclick="clearCell()">지우기</button>
        <button class="key-btn" onclick="inputNumber(6)">6</button>
        <button class="key-btn" onclick="inputNumber(7)">7</button>
        <button class="key-btn" onclick="inputNumber(8)">8</button>
        <button class="key-btn" onclick="inputNumber(9)">9</button>
        <button class="key-btn num-10" onclick="inputNumber(10)">10</button>
        <button class="key-btn action" style="background-color: #34495e;" onclick="deselectCell()">선택해제</button>
    </div>

    <script>
        const board = document.getElementById('board');
        let selectedCell = null;

        // 예시용 초기 배치 데이터 (0은 빈칸)
        const initialData = [
            0, 0, 3, 0, 2, 0, 6, 0, 0,
            9, 0, 0, 3, 0, 5, 0, 0, 1,
            0, 0, 1, 8, 0, 6, 4, 0, 0,
            0, 0, 8, 1, 0, 2, 9, 0, 0,
            7, 0, 0, 0, 0, 0, 0, 0, 8,
            0, 0, 6, 7, 0, 8, 2, 0, 0,
            0, 0, 2, 6, 0, 9, 5, 0, 0,
            8, 0, 0, 2, 0, 3, 0, 0, 9,
            0, 0, 5, 0, 1, 0, 3, 0, 0
        ];

        // 보드 생성 (input 태그를 배제하여 모바일 키보드 출현 완전 차단)
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.index = i;

            if (initialData[i] !== 0) {
                cell.textContent = initialData[i];
                cell.classList.add('fixed');
            } else {
                cell.addEventListener('click', () => selectCell(cell));
            }

            board.appendChild(cell);
        }

        function selectCell(cell) {
            if (selectedCell) {
                selectedCell.classList.remove('selected');
            }
            selectedCell = cell;
            cell.classList.add('selected');
        }

        function deselectCell() {
            if (selectedCell) {
                selectedCell.classList.remove('selected');
                selectedCell = null;
            }
        }

        // 숫자 입력 및 10 폰트 축소 분기
        function inputNumber(num) {
            if (!selectedCell || selectedCell.classList.contains('fixed')) return;

            selectedCell.textContent = num;

            // 값이 10이거나 두 자리 이상이면 글자 크기를 즉시 축소
            if (num >= 10) {
                selectedCell.classList.add('two-digits');
            } else {
                selectedCell.classList.remove('two-digits');
            }
        }

        // 셀 값 지우기
        function clearCell() {
            if (!selectedCell || selectedCell.classList.contains('fixed')) return;
            selectedCell.textContent = '';
            selectedCell.classList.remove('two-digits');
        }

        // 보드 외부 클릭 시 선택 해제
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.sudoku-board') && !e.target.closest('.keypad')) {
                deselectCell();
            }
        });
    </script>
</body>
</html>
