<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 딸을 위한 스마트 스도쿠</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f9fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 5px;
            text-align: center;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        select, button {
            padding: 8px 14px;
            font-size: 0.95rem;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            background-color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
        }
        button:active {
            background-color: #2980b9;
        }
        #board-container {
            overflow: auto;
            max-width: 100%;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        table {
            border-collapse: collapse;
            margin: 0 auto;
        }
        td {
            border: 1px solid #7f8c8d;
            width: 38px;
            height: 38px;
            text-align: center;
            vertical-align: middle;
            padding: 0;
        }
        input.sudoku-cell {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            background: transparent;
            box-sizing: border-box;
            color: #2980b9;
        }
        input.sudoku-cell:focus {
            outline: 2px solid #e74c3c;
            background-color: #fadbd8;
        }
        .fixed-cell {
            background-color: #d5dbdb;
            color: #2c3e50;
        }
        .message {
            margin-top: 15px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <h1>🧩 스마트 두뇌 스도쿠</h1>
    <p class="subtitle">오류 없는 완벽한 숫자 퍼즐</p>

    <div class="controls">
        <select id="sizeSelect">
            <option value="4">4 x 4 (쉬움)</option>
            <option value="5">5 x 5</option>
            <option value="6">6 x 6</option>
            <option value="7">7 x 7</option>
            <option value="8">8 x 8</option>
            <option value="9" selected>9 x 9 (표준)</option>
            <option value="10">10 x 10 (도전)</option>
        </select>
        <button onclick="initGame()">새 게임</button>
        <button onclick="checkAnswer()" style="background-color: #2ecc71;">정답 확인</button>
    </div>

    <div id="board-container">
        <div id="sudoku-board"></div>
    </div>

    <div class="message" id="message"></div>

    <script>
        let currentSize = 9;
        let solutionBoard = [];
        let puzzleBoard = [];

        function initGame() {
            currentSize = parseInt(document.getElementById('sizeSelect').value);
            document.getElementById('message').innerText = '';
            
            generateValidSudoku(currentSize);
            renderBoard();
        }

        // 완벽하게 규칙에 맞는 스도쿠 보드 생성 알고리즘
        function generateValidSudoku(size) {
            solutionBoard = Array(size).fill(0).map(() => Array(size).fill(0));
            
            // 기본 시프트 패턴으로 유효한 기본 정답판 생성
            let shift = size === 4 || size === 6 || size === 8 || size === 10 ? 2 : 3;
            if (size === 5 || size === 7) shift = 2;

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let val = ((r * shift + c + Math.floor(r / 2)) % size) + 1;
                    solutionBoard[r][c] = val;
                }
            }

            // 행 전체를 무작위로 섞어 매번 다른 문제가 나오도록 함
            for (let i = 0; i < size; i++) {
                let r1 = Math.floor(Math.random() * size);
                let r2 = Math.floor(Math.random() * size);
                let temp = solutionBoard[r1];
                solutionBoard[r1] = solutionBoard[r2];
                solutionBoard[r2] = temp;
            }

            // 정답판을 기반으로 적절히 숫자를 숨겨 퍼즐판 만들기 (난이도에 따라 약 40~50% 빈칸)
            puzzleBoard = JSON.parse(JSON.stringify(solutionBoard));
            let removeCount = Math.floor(size * size * 0.45); // 지울 칸 수
            
            let removed = 0;
            while (removed < removeCount) {
                let rr = Math.floor(Math.random() * size);
                let rc = Math.floor(Math.random() * size);
                if (puzzleBoard[rr][rc] !== 0) {
                    puzzleBoard[rr][rc] = 0;
                    removed++;
                }
            }
        }

        function renderBoard() {
            const container = document.getElementById('sudoku-board');
            let html = '<table>';
            
            for (let r = 0; r < currentSize; r++) {
                html += '<tr>';
                for (let c = 0; c < currentSize; c++) {
                    let val = puzzleBoard[r][c];
                    let isFixed = val !== 0;

                    if (isFixed) {
                        html += `<td><input type="number" class="sudoku-cell fixed-cell" value="${val}" readonly></td>`;
                    } else {
                        html += `<td><input type="number" class="sudoku-cell" min="1" max="${currentSize}" id="cell-${r}-${c}" placeholder=""></td>`;
                    }
                }
                html += '</tr>';
            }
            html += '</table>';
            container.innerHTML = html;
        }

        function checkAnswer() {
            const msg = document.getElementById('message');
            let isComplete = true;
            let userBoard = Array(currentSize).fill(0).map(() => Array(currentSize).fill(0));

            for (let r = 0; r < currentSize; r++) {
                for (let c = 0; c < currentSize; c++) {
                    if (puzzleBoard[r][c] !== 0) {
                        userBoard[r][c] = puzzleBoard[r][c];
                    } else {
                        const input = document.getElementById(`cell-${r}-${c}`);
                        const val = parseInt(input.value);
                        if (isNaN(val)) {
                            isComplete = false;
                            userBoard[r][c] = 0;
                        } else {
                            userBoard[r][c] = val;
                        }
                    }
                }
            }

            if (!isComplete) {
                msg.style.color = '#e67e22';
                msg.innerText = '⚠️ 아직 채워지지 않은 빈칸이 있습니다!';
                return;
            }

            // 가로줄, 세로줄 유효성 검사
            let isValid = true;
            for (let i = 0; i < currentSize; i++) {
                let rowSet = new Set();
                let colSet = new Set();
                for (let j = 0; j < currentSize; j++) {
                    rowSet.add(userBoard[i][j]);
                    colSet.add(userBoard[j][i]);
                }
                if (rowSet.size !== currentSize || colSet.size !== currentSize) {
                    isValid = false;
                }
            }

            if (isValid) {
                msg.style.color = '#27ae60';
                msg.innerText = '🎉 정답입니다! 완벽하게 퍼즐을 풀었어요!';
            } else {
                msg.style.color = '#c0392b';
                msg.innerText = '❌ 가로 또는 세로 줄에 중복된 숫자가 있어요. 다시 확인해 보세요!';
            }
        }

        window.onload = initGame;
        document.getElementById('sizeSelect').addEventListener('change', initGame);
    </script>
</body>
</html>
