<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 아이 쏙쏙 색칠놀이</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <h1>🎨 쏙쏙 색칠놀이</h1>
        
        <div id="main-layout">
            <!-- 좌측: 밑그림 선택 (30종) -->
            <div id="template-sidebar">
                <h3>밑그림 선택 (30종)</h3>
                <div id="template-grid"></div>
            </div>

            <!-- 중앙: 캔버스 및 도구 -->
            <div id="canvas-area">
                <canvas id="coloringCanvas"></canvas>

                <div id="ui-container">
                    <!-- 도구 선택 버튼 영역 -->
                    <div id="tools">
                        <button class="tool-btn active" data-tool="pen">사인펜</button>
                        <button class="tool-btn" data-tool="colored-pencil">색연필</button>
                        <button class="tool-btn" data-tool="bucket">페인트 버킷</button>
                    </div>

                    <!-- 32컬러 팔레트 및 질감 선택 영역 -->
                    <div id="palette-control-container">
                        <div id="texture-selector">
                            <label>질감 선택: </label>
                            <button class="tex-btn active" data-texture="solid">기본</button>
                            <button class="tex-btn" data-texture="watercolor">수채화</button>
                            <button class="tex-btn" data-texture="crayon">크레파스</button>
                            <button class="tex-btn" data-texture="glitter">반짝이</button>
                        </div>
                        <div id="palette-container">
                            <div id="palette"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
